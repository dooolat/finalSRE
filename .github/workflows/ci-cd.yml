name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/orders-service-sre-capstone
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'orders-prod' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-publish:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Required secret for automatic deployment:
      # KUBECONFIG_B64 = base64-encoded kubeconfig for the target cluster
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - name: Check deployment prerequisites
        id: deploy-check
        shell: bash
        run: |
          if [ -n "${KUBECONFIG_B64}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG_B64 is not configured. Deployment steps will be skipped."
          fi

      - name: Checkout
        if: steps.deploy-check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up kubectl
        if: steps.deploy-check.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.2

      - name: Restore kubeconfig
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests
        if: steps.deploy-check.outputs.enabled == 'true'
        run: kubectl apply -k k8s/base

      - name: Update image
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          kubectl set image deployment/orders-service orders-service=${{ needs.build-and-publish.outputs.image }} -n "${KUBE_NAMESPACE}"
          kubectl rollout status deployment/orders-service -n "${KUBE_NAMESPACE}" --timeout=120s
