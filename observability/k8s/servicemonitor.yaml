apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-service
  namespace: orders-prod
  labels:
    app.kubernetes.io/name: orders-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
